<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Premium Dubai travel concierge services. Book desert safaris, yacht rentals, restaurant reservations, and VIP nightlife access. Your complete Dubai experience, end-to-end." />
    <meta name="keywords" content="Dubai travel, desert safari, yacht rental, restaurant reservations, VIP nightlife, luxury concierge, Dubai booking" />
    <meta name="author" content="Your Dubai Booking" />
    <meta property="og:title" content="Your Dubai Booking | Premium Travel Concierge Services" />
    <meta property="og:description" content="Experience Dubai like never before. Desert safaris, yacht rentals, exclusive dining, and VIP nightlife access." />
    <meta property="og:type" content="website" />
    <title>Your Dubai Booking | Premium Travel Concierge Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <!-- GetYourGuide Analytics -->
    <script async defer src="https://widget.getyourguide.com/dist/pa.umd.production.min.js" data-gyg-partner-id="05E1XCJ"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              'luxury-black': '#0a0a0a',
              'luxury-gold': '#C5A059',
              'luxury-charcoal': '#1a1a1a',
              'luxury-gray': '#f5f5f5',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'slow-pan': 'panImage 30s linear infinite alternate',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              panImage: {
                '0%': { transform: 'scale(1.1) translate(0%, 0%)' },
                '100%': { transform: 'scale(1.15) translate(-2%, -2%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for a premium feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
