<svg width="280" height="160" viewBox="0 0 280 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold gradient for metallic effect -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <!-- Highlight gradient for 3D effect -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE87C;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0.3" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hotel Bell Icon -->
  <g transform="translate(140, 50)">
    <!-- Bell dome (main body) -->
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="0.5"/>
    
    <!-- Bell highlight for 3D effect -->
    <ellipse cx="-8" cy="-8" rx="18" ry="20" fill="url(#goldHighlight)" opacity="0.6"/>
    
    <!-- Top button/knob -->
    <ellipse cx="0" cy="-30" rx="4" ry="5" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="0.5"/>
    <rect x="-2" y="-35" width="4" height="5" fill="url(#goldGradient)" rx="1"/>
    
    <!-- Rectangular detail at bottom center -->
    <rect x="-6" y="20" width="12" height="4" fill="#B8860B" rx="1" opacity="0.7"/>
    
    <!-- Bell base (flat oval) -->
    <ellipse cx="0" cy="30" rx="20" ry="6" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="0.5"/>
    
    <!-- Specular highlights -->
    <ellipse cx="-10" cy="-10" rx="8" ry="10" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Text: YOUR DUBAI BOOKING -->
  <text x="140" y="120" font-family="'Playfair Display', serif" font-size="18" font-weight="600" text-anchor="middle" fill="url(#goldGradient)" filter="url(#shadow)" letter-spacing="2">
    YOUR DUBAI BOOKING
  </text>
</svg>
